services:
  translation:
    build:
      context: ../..
      dockerfile: cloud/oci/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      SAYLACIAN_SERVICE_TOKEN: ${SAYLACIAN_SERVICE_TOKEN:?Set a long random API token in .env}
    expose:
      - "8080"
    mem_limit: 8g
    cpus: 1.8

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SAYLACIAN_DOMAIN: ${SAYLACIAN_DOMAIN:?Set your domain name in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - translation

volumes:
  caddy_data:
  caddy_config:
