name: User source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-lock.txt
      - name: Install runtime and lint dependencies
        run: |
          python -m pip install -r requirements-runtime-lock.txt
          python -m pip install ruff==0.14.2
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q main.py app saylacian tests
      - name: Check formatting
        run: python -m ruff format --check main.py saylacian tests
      - name: Lint Python errors
        run: python -m ruff check --select E9,F63,F7,F82 main.py app saylacian tests
      - name: Run tests without downloading language packs
        run: python -m unittest discover -s tests -v
