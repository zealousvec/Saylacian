# SPDX-License-Identifier: AGPL-3.0-or-later
name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install app and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q main.py app saylacian tools tests
      - name: Run Ruff lint
        run: python -m ruff check main.py app saylacian tools tests
      - name: Check Ruff formatting
        run: python -m ruff format --check main.py app saylacian tools tests
      - name: Check accidental credentials
        run: python tools/check_release_safety.py
      - name: Run full test suite without downloading language packs
        run: python -m pytest -q

  windows-portable-zip:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build-lock.txt
      - name: Install pinned Windows build dependencies
        run: python -m pip install -r requirements-build-lock.txt
      - name: Build and hash portable ZIP candidate
        run: >-
          python tools/build_windows_portable.py
          --distpath "${{ runner.temp }}/saylacian-dist"
          --workpath "${{ runner.temp }}/saylacian-build"
          --archive "${{ runner.temp }}/Saylacian-Portable.zip"
      - name: Verify candidate manifest
        run: >-
          python -c "from pathlib import Path; from tools.package_msix import verify_candidate; import json; root=Path('${{ runner.temp }}/saylacian-dist/Saylacian'); manifest=Path('${{ runner.temp }}/saylacian-dist/Saylacian-Portable.manifest.json'); print(f'Verified {verify_candidate(root, manifest)} files; runtime_verified=false')"
      - uses: actions/upload-artifact@v4
        with:
          name: Saylacian-Windows-portable-alpha-candidate
          path: |
            ${{ runner.temp }}/Saylacian-Portable.zip
            ${{ runner.temp }}/Saylacian-Portable.zip.sha256
            ${{ runner.temp }}/saylacian-dist/Saylacian-Portable.manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
