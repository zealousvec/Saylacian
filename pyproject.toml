[tool.saylacian]
project-name = "Saylacian"
version = "0.1.0a1"
spdx-license-expression = "AGPL-3.0-or-later"
license-scope = "Saylacian-authored code that the project licensor owns or has the right to license; separately licensed third-party works remain under their own terms."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E401", "E501", "I"]

[tool.ruff.lint.isort]
force-single-line = true
